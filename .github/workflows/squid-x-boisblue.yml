name: Squid X Boisblue - Base Builder

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Git config
        run: |
          git config user.name "boisblue"
          git config user.email "149630680+boisblue@users.noreply.github.com"

      - name: Sync latest changes
        run: |
          git pull origin main --rebase

      - name: Generate random commits
        run: |
          COMMIT_COUNT=0

          for i in {1..30}; do
            if [ "$COMMIT_COUNT" -ge 10 ]; then
              break
            fi

            echo "🎲 Running commit script $i"

            node commit_script.js $i

            git add components/SwapWidget.jsx

            # Skip if no staged changes
            if git diff --cached --quiet; then
              echo "⏭️ No changes detected"
              continue
            fi

            COMMIT_COUNT=$((COMMIT_COUNT + 1))

            git commit -m "chore: random config #${COMMIT_COUNT}/10"

            echo "✅ Commit created: $COMMIT_COUNT/10"

            sleep $((RANDOM % 10 + 5))
          done

          echo "🚀 Total commits created: $COMMIT_COUNT"

      - name: Push commits
        run: |
          git pull origin main --rebase
          git push origin main