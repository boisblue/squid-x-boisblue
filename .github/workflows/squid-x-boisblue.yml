name: Squid X Boisblue - Base Builder

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  daily-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate random commits
        run: |
          COMMIT_COUNT=0

          for i in {1..20}; do
            if [ "$COMMIT_COUNT" -ge 10 ]; then
              break
            fi

            node commit_script.js $i

            git add components/SwapWidget.jsx

            if git diff --cached --quiet; then
              echo "⏭️ No changes"
              continue
            fi

            COMMIT_COUNT=$((COMMIT_COUNT + 1))

            git commit -m "chore: random config #${COMMIT_COUNT}/10"

            sleep $((RANDOM % 10 + 5))
          done

      - name: Push commits
        run: git push